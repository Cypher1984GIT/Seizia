name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # One runner at a time: parallel jobs race to create the same release and
      # end up duplicating it or dropping assets from it.
      max-parallel: 1
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Linux build tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install Dependencies
        run: npm ci

      - name: Check syntax
        run: npm test

      # macOS ad-hoc signing lives in package.json (mac.identity), not here:
      # setting CSC_IDENTITY_AUTO_DISCOVERY=false would skip signing entirely
      # and ship a bundle Gatekeeper reports as damaged on Apple Silicon.
      #
      # electron-builder also publishes implicitly the moment it detects CI, so
      # anything that is not a tag has to opt out explicitly.
      - name: Build and Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${{ startsWith(github.ref, 'refs/tags/') }}" == "true" ]]; then
            npm run build -- --publish always
          else
            npm run build -- --publish never
          fi
        shell: bash

      - name: Upload the installers for testing
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: seizia-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error
          retention-days: 14
