<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: transparent;
            overflow: hidden;
            font-family: "IBM Plex Mono", ui-monospace, monospace;
        }

        body {
            padding: 12px;
        }

        .panel {
            margin: 0;
            width: 200px;
            border-radius: 2px;
            border: 1px solid #2a2d33;
            overflow: hidden;
            padding: 4px 0;
        }

        html:not(.dark) .panel {
            background: #f3eee6;
            border-color: #d8cfc0;
            box-shadow: 0 12px 28px rgba(26, 24, 20, 0.12);
        }

        html.dark .panel {
            background: #14161a;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4);
        }

        .item {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border: 0;
            border-radius: 0;
            background: transparent;
            font-size: 12px;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            box-sizing: border-box;
            appearance: none;
            -webkit-appearance: none;
        }

        html:not(.dark) .item {
            color: #5c564c;
        }

        html.dark .item {
            color: #ebe4d4;
        }

        html:not(.dark) .item:hover {
            background: #ebe4d4;
        }

        html.dark .item:hover {
            background: #22252b;
        }

        html:not(.dark) .item.reset {
            color: #b42318;
        }

        html.dark .item.reset {
            color: #f87171;
        }

        html:not(.dark) .item.reset:hover {
            background: #f4d6d2;
        }

        html.dark .item.reset:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        svg {
            flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div class="item" role="button" tabindex="0" id="more-menu-help">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <circle cx="12" cy="12" r="10"></circle>
                <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
                <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            Help
        </div>
        <div class="item" role="button" tabindex="0" id="more-menu-permissions">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
                <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
                <line x1="12" y1="19" x2="12" y2="23" />
                <line x1="8" y1="23" x2="16" y2="23" />
            </svg>
            Permissions
        </div>
        <div class="item reset" role="button" tabindex="0" id="more-menu-reset">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Reset
        </div>
    </div>
</body>
</html>
